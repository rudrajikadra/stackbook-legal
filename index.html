<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackbook</title>
<meta name="description" content="Stackbook: Crypto DCA Tracker, a calm, private journal for Bitcoin and Ethereum investing.">
<style>
  :root{--canvas:#F5F3F8; --ink:#1B1830; --muted:#5E5A72; --accent:#5B3FC4; --hair:#DDD8E8}
  @media (prefers-color-scheme: dark){:root{--canvas:#0E0C16; --ink:#F1EEF8; --muted:#9A95AE; --accent:#B4A2F5; --hair:#2B2640}}
  body{margin:0; background:var(--canvas); color:var(--ink); padding:0 16px;
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:720px; margin:0 auto; padding:72px 0}
  h1{font-size:clamp(30px,6vw,42px); line-height:1.12; margin:0 0 12px; letter-spacing:-.02em}
  p{color:var(--muted); margin:0 0 24px}
  a{color:var(--accent); text-underline-offset:3px; font-weight:600}
  ul{list-style:none; padding:0; margin:0; border-top:1px solid var(--hair)}
  li{padding:14px 0; border-bottom:1px solid var(--hair)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stackbook</h1>
  <p>A calm, private journal for Bitcoin and Ethereum investing. Published by Shaping Edge.</p>
  <ul>
    <li><a href="support.html">Support</a></li>
    <li><a href="privacy.html">Privacy Policy</a></li>

  </ul>
</div>
